version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # TS 采用 side-by-side：`typescript` 别名到 @typescript/typescript6（仅含 6.0 JS API，供
      # typescript-eslint 等工具使用，peer <6.1.0），`@typescript/native` 别名到 typescript@7（tsc 原生
      # 二进制）。typescript-eslint 官方支持 TS 7 的 JS API（7.1 起）前，禁止把 6.0 别名升到 6.1+。
      # 背景：issue #41 / PR #52 / PR #54。
      - dependency-name: 'typescript'
        versions: ['>=6.1']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

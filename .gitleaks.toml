title = "A10 gitleaks config"

# 继承 gitleaks 默认规则集，仅对单元测试目录放行，
# 保证 src/ 等真实源码仍被完整扫描。
[extend]
useDefault = true

# 单元测试里的假密钥占位符（非真实凭据）按路径整体放行。
# gitleaks 8.24 全局 allowlist 采用 paths / regexes 字段。
[allowlist]
description = "单元测试中的假密钥占位符，非真实凭据"
paths = [
  '''(^|/)tests/'''
]
regexes = [
  '''sk-(ant|ds)-[a-z0-9]+''',
  '''test-key-placeholder''',
  '''dummy-key'''
]
regexTarget = "line"
